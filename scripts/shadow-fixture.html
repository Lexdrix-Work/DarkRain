<!doctype html><html><body style="margin:0"><canvas id="view"></canvas><script type="module">
import * as THREE from 'three';import {MeshStandardNodeMaterial} from 'three/webgpu';
import RAPIER from '@dimforge/rapier3d-compat';
import {PhysicsSystem} from '../src/systems/PhysicsSystem.js';import {addDestructibleWalls} from '../src/world/DestructibleWalls.js';
import {createModernRenderer} from '../src/render/ModernRenderer.ts';import {DayNightCycle} from '../src/systems/DayNightCycle.js';import {updateShadowMaps,flushShadowInvalidation} from '../src/systems/ShadowUpdates.js';
window.runShadows=async()=>{const r=await createModernRenderer(document.getElementById('view'));r.setSize(960,540);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFShadowMap;r.toneMapping=THREE.ACESFilmicToneMapping;
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,960/540,.1,200);camera.position.set(5,3.5,7);camera.lookAt(0,.5,0);const g={scene,camera,renderer:r,player:{position:new THREE.Vector3()},settings:{quality:'high'},physicsSystem:{dynamic:new Map()}};g.dayNightCycle=new DayNightCycle(g);
 const floor=new THREE.Mesh(new THREE.BoxGeometry(24,.2,24),new MeshStandardNodeMaterial({color:0x8f9695,roughness:.95}));floor.position.y=-.1;floor.receiveShadow=true;scene.add(floor);
 const cube=new THREE.Mesh(new THREE.BoxGeometry(.8,1.8,.6),new MeshStandardNodeMaterial({color:0x5f6d62,roughness:.9}));cube.position.set(-2,.9,0);cube.castShadow=cube.receiveShadow=true;scene.add(cube);g.physicsSystem.dynamic.set(1,{mesh:cube,body:{isSleeping:()=>false}});
 const finish=async()=>{if(r.backend.device)await r.backend.device.queue.onSubmittedWorkDone();else r.getContext().finish();},render=async()=>{r._nodes.nodeFrame.update();r.render(scene,camera);await finish();return r.domElement.toDataURL('image/png');};
 const cases=[];for(const [name,time]of [['dawn',6.5],['noon',12],['dusk',17.5],['night',0]]){g.dayNightCycle.setTime(time);g.dayNightCycle.sunLight.userData.shadowEnabled=g.dayNightCycle.moonLight.userData.shadowEnabled=true;g.dayNightCycle.update(0);cube.position.x=-2;r.shadowMap.needsUpdate=true;flushShadowInvalidation(g);await render();g.dayNightCycle.sunLight.shadow.needsUpdate=g.dayNightCycle.moonLight.shadow.needsUpdate=false;cube.position.x=2;const before=await render();updateShadowMaps(g,1/60);flushShadowInvalidation(g);const after=await render();cases.push({name,time,before,after,changed:before!==after});}
 // A physical support-loss case, with no torque/velocity animation applied.
 await RAPIER.init();const world=new RAPIER.World({x:0,y:-9.81,z:0});world.createCollider(RAPIER.ColliderDesc.cuboid(12,.1,12).setTranslation(0,-.1,0));cube.visible=false;g.dayNightCycle.setTime(12);
 const props=[];for(const x of [-.9,.9]){const m=new THREE.Mesh(new THREE.BoxGeometry(.24,1,1),new MeshStandardNodeMaterial({color:0x6d7470,roughness:.9}));m.position.set(x,.5,0);m.castShadow=m.receiveShadow=true;scene.add(m);props.push({mesh:m,collider:world.createCollider(RAPIER.ColliderDesc.cuboid(.12,.5,.5).setTranslation(x,.5,0))});}
 const beam=new THREE.Mesh(new THREE.BoxGeometry(2.6,.2,.9),new MeshStandardNodeMaterial({color:0x92794e,roughness:.9}));beam.castShadow=beam.receiveShadow=true;scene.add(beam);const body=world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(0,1.12,0).setAngularDamping(.25).setCcdEnabled(true));world.createCollider(RAPIER.ColliderDesc.cuboid(1.3,.1,.45).setMass(40).setFriction(.7),body);g.physicsSystem.dynamic.clear();g.physicsSystem.dynamic.set(1,{mesh:beam,body});
 for(let i=0;i<240;i++)world.step();beam.position.copy(body.translation());beam.quaternion.copy(body.rotation());r.shadowMap.needsUpdate=true;flushShadowInvalidation(g);const before=await render();world.removeCollider(props[0].collider,true);props[0].mesh.visible=false;let maxTiltRadians=0;
 for(let i=0;i<240;i++){world.step();maxTiltRadians=Math.max(maxTiltRadians,2*Math.asin(Math.min(1,Math.abs(body.rotation().z))));}beam.position.copy(body.translation());beam.quaternion.copy(body.rotation());r.shadowMap.needsUpdate=true;flushShadowInvalidation(g);const after=await render();if(maxTiltRadians<.2||body.translation().y>=1)throw Error('Physical support-loss tipping did not occur');cases.push({name:'support-loss',time:12,before,after,changed:before!==after,maxTiltRadians,gravityOnly:true,massKg:body.mass()});world.free();
 // Exercise the actual wall hit/fracture/body pipeline, not a visual breakup.
 beam.removeFromParent();for(const prop of props)prop.mesh.removeFromParent();const wm={scene,materials:{},colliders:[floor],_cityObjects:[],buildingSpots:[],entities:new Map(),getTerrainHeight:()=>0};g.worldManager=wm;
 const building=new THREE.Group();building.updateMatrixWorld(true);const wallMaterial=new THREE.MeshStandardMaterial({color:0x9b9d92,roughness:.95});wallMaterial.userData.proceduralKind='concrete';
 const wall=addDestructibleWalls(wm,building,[{size:[1.2,1.2,.25],position:[0,.6,0],health:68,density:2100}],wallMaterial);g.physicsSystem=new PhysicsSystem(g);await g.physicsSystem.init();await g.physicsSystem.masonry.dust?.compute?.ready;g.physicsSystem.playerBody.setTranslation({x:10,y:1,z:10},false);const pane=wall.userData.panes[0],mass=pane.size.x*pane.size.y*pane.size.z*pane.density;r.shadowMap.needsUpdate=true;flushShadowInvalidation(g);const wallBefore=await render();
 for(let i=0;i<3;i++)g.physicsSystem.hit({object:wall,instanceId:0,point:pane.position.clone()},new THREE.Vector3(0,0,-1),20);
 const massAfter=[...g.physicsSystem.dynamic.values()].filter(p=>p.kind==='wall-chip').reduce((sum,p)=>sum+p.body.mass(),0);if(!pane.broken||Math.abs(massAfter-mass)>.1)throw Error('Cracked wall did not release retained physical mass');
 for(let i=0;i<180;i++)g.physicsSystem.update(1/60);r.shadowMap.needsUpdate=true;flushShadowInvalidation(g);const wallAfter=await render();cases.push({name:'wall-crumble',time:12,before:wallBefore,after:wallAfter,changed:wallBefore!==wallAfter,hits:3,damagePerHit:20,massBefore:mass,massAfter,settled:g.physicsSystem.masonry.settled.length});g.physicsSystem.dispose();
 return {backend:r.backendName,resolution:[960,540],scope:'production shadows, gravity tipping and wall-fracture pipeline; controlled components, not full-city clearance',cases};};window.fixtureReady=true;
</script></body></html>
