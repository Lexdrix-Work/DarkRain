<!doctype html><html><body style="margin:0;background:#111"><canvas id="view"></canvas><script type="module">
import RAPIER from '@dimforge/rapier3d-compat';import {WorldDetailSystem} from '../src/systems/WorldDetailSystem.js';import {warmSceneShaders} from '../src/render/ShaderWarmup.ts';import * as THREE from 'three';import * as N from 'three/tsl';import {RenderPipeline,MeshStandardNodeMaterial} from 'three/webgpu';
import {createModernRenderer,createBodycamPipeline} from '../src/render/ModernRenderer.ts';import {installNodeMaterialBridge} from '../src/render/NodeMaterialBridge.js';import {getProceduralSet,preloadSurfaceTextures} from '../src/world/ProceduralTextures.js';import {surfaceCoordinates} from '../src/world/SurfaceCoordinates.js';import {fractureSlab} from '../src/systems/destruction/FractureGeometry.ts';
window.runFidelity=async()=>{
 await RAPIER.init();const physics=new RAPIER.World({x:0,y:-9.81,z:0});physics.createCollider(RAPIER.ColliderDesc.cuboid(6,.1,5).setTranslation(0,-.1,0));const r=await createModernRenderer(document.getElementById('view'));installNodeMaterialBridge(r);r.setSize(1280,720);r.setPixelRatio(1);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1;
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x66717b);const camera=new THREE.PerspectiveCamera(60,1280/720,.1,100);camera.position.set(2.6,1.5,3.7);camera.lookAt(0,.35,-1);
 const game={renderer:r,scene,camera,settings:{quality:'high',autoQuality:false,postProcessing:true,bloom:true,antiAliasing:true,filmGrain:true,vignette:true,chroma:false,ambientOcclusion:false,lensDirt:false,rollingShutter:false,cameraMotion:100},inputManager:{getMouseDelta:()=>({x:30,y:0})}};await preloadSurfaceTextures(game);
 scene.add(new THREE.HemisphereLight(0xc3d7ea,0x494737,.65));const sun=new THREE.DirectionalLight(0xffddbc,2);sun.position.set(-3,7,5);scene.add(sun);
 const family=kind=>{const s=getProceduralSet(kind);return new THREE.MeshStandardMaterial({map:s.map,normalMap:s.normalMap,roughnessMap:s.roughnessMap,aoMap:s.aoMap,aoMapIntensity:.4,roughness:.94,normalScale:new THREE.Vector2(.6,.6)});};
 const concrete=family('concrete'),brick=family('brick');const floor=new THREE.Mesh(new THREE.BoxGeometry(12,.2,10),concrete);floor.position.y=-.1;scene.add(floor);const wall=new THREE.Mesh(new THREE.BoxGeometry(7,3,.25),brick);wall.position.set(-.7,1.5,-3);scene.add(wall);
 const modern=family('concrete');modern.userData.fractureSurface=true;modern.userData.fractureKind='concrete';const old=new MeshStandardNodeMaterial({map:concrete.map,roughness:.94});old.colorNode=N.mix(N.texture(concrete.map).rgb,N.vec3(.32,.29,.24),N.attribute('fractureFace','float'));
 const shards=[];for(const [i,p]of fractureSlab(new THREE.Vector3(2,1.8,.5),18,1337).entries()){surfaceCoordinates(p.geometry,p.size);const mesh=new THREE.Mesh(p.geometry,modern);mesh.scale.copy(p.size);mesh.position.set((i%6-2.5)*.65,.16+(i%3)*.09,-1+(Math.floor(i/6)-1)*.7);mesh.rotation.set(-Math.PI/2,.2*i,.16*i);scene.add(mesh);shards.push(mesh);const body=physics.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(mesh.position.x,mesh.position.y+1,mesh.position.z).setRotation(mesh.quaternion));const p0=mesh.geometry.attributes.position,v=new Float32Array(p0.count*3);for(let j=0;j<p0.count;j++){v[j*3]=p0.getX(j)*p.size.x;v[j*3+1]=p0.getY(j)*p.size.y;v[j*3+2]=p0.getZ(j)*p.size.z;}physics.createCollider(RAPIER.ColliderDesc.convexHull(v).setMass(p.volume*1700).setFriction(.8),body);mesh.userData.body=body;}const crate=new THREE.Mesh(new THREE.BoxGeometry(.8,.8,.8),family('wood'));crate.position.set(-2,.4,-.3);scene.add(crate);
 const glow=new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),new THREE.MeshStandardMaterial({color:0x55aaff,emissive:0x3388ff,emissiveIntensity:5}));glow.position.set(1.8,.6,-2.3);scene.add(glow);const lamp=new THREE.PointLight(0x3399ff,5,3);lamp.position.copy(glow.position);scene.add(lamp);
 for(let i=0;i<300;i++)physics.step();for(const m of shards){m.position.copy(m.userData.body.translation());m.quaternion.copy(m.userData.body.rotation());}
 const dynamic=new Map(shards.map((m,i)=>[i,{id:i,kind:'structural',body:m.userData.body,mesh:m,size:m.scale}]));Object.assign(game,{player:{position:camera.position},physicsSystem:{world:physics,dynamic},worldManager:{entities:new Map(),buildingSpots:[],getTerrainHeight:()=>0},weatherSystem:{params:{}},dayNightCycle:{sunLight:sun,isNight:()=>false}});const contacts=new WorldDetailSystem(game);await warmSceneShaders(r,[{scene,camera}],()=>{});
 const advance=()=>{if(!r._nodes?.nodeFrame?.update)throw Error('Pinned Three renderer frame adapter unavailable');r._nodes.nodeFrame.update();};const finish=async()=>{if(r.backendName==='WebGPU')await r.backend.device.queue.onSubmittedWorkDone();else{const gl=r.getContext();if(gl.isContextLost())throw Error('Fixture context lost');gl.finish();}};const result=[];
 for(const name of ['flat-fracture','pbr-fracture','ao','lens','lens','ao','pbr-fracture','flat-fracture']){for(const m of shards)m.material=name==='flat-fracture'?old:modern;game.settings.ambientOcclusion=['ao','lens'].includes(name);game.settings.chroma=name==='lens';game.settings.lensDirt=name==='lens';game.settings.rollingShutter=name==='lens';const coldStart=performance.now();const pipeline=createBodycamPipeline(game);contacts.update(0);contacts.contacts.visible=['ao','lens'].includes(name);advance();pipeline.render();await finish();const coldFirstMs=performance.now()-coldStart;for(let i=0;i<5;i++){advance();pipeline.render();await finish();}const times=[];for(let i=0;i<120;i++){const t=performance.now();contacts.update(1/60);contacts.contacts.visible=['ao','lens'].includes(name);advance();pipeline.render();await finish();times.push(performance.now()-t);}let aoRange=null,aoMask=null;const node=pipeline.aoNode();if(node){const display=new RenderPipeline(r);display.outputColorTransform=false;display.outputNode=N.vec4(node,node,node,1);advance();display.render();await finish();aoMask=r.domElement.toDataURL('image/png');const copy=document.createElement('canvas');copy.width=1280;copy.height=720;const ctx=copy.getContext('2d');ctx.drawImage(r.domElement,0,0);const pixels=ctx.getImageData(0,0,1280,720).data;let min=255,max=0;for(let i=0;i<pixels.length;i+=4){min=Math.min(min,pixels[i]);max=Math.max(max,pixels[i]);}aoRange={min,max};display.dispose();}
 advance();pipeline.render();await finish();const png=r.domElement.toDataURL('image/png');times.sort((a,b)=>a-b);result.push({name,coldFirstMs,aoRange,aoMask,diagnostics:pipeline.diagnostics(),mean:times.reduce((s,v)=>s+v,0)/times.length,p95:times[Math.floor(times.length*.95)],png});pipeline.dispose();}
 return {backend:r.backendName,resolution:[1280,720],scope:'material/post component fixture, no city simulation or destruction load',metric:'serial render plus GPU completion; pinned r186 NodeFrame advanced per sample; not presentation pacing',cases:result};
};window.fixtureReady=true;
</script></body></html>
